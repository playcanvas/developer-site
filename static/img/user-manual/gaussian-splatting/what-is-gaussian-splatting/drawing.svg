<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Drawing a splat in three steps: project each 3D Gaussian to a 2D ellipse on the screen, sort the ellipses by distance from the camera, then blend them from back to front</title>
  <defs>
    <radialGradient id="flat-orange">
      <stop offset="0" stop-color="#f76b15" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#f76b15" stop-opacity="0.7"/>
      <stop offset="0.75" stop-color="#f76b15" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f76b15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flat-green">
      <stop offset="0" stop-color="#30a46c" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#30a46c" stop-opacity="0.7"/>
      <stop offset="0.75" stop-color="#30a46c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#30a46c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flat-blue">
      <stop offset="0" stop-color="#3e63dd" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#3e63dd" stop-opacity="0.7"/>
      <stop offset="0.75" stop-color="#3e63dd" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3e63dd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="round-orange" fx="0.38" fy="0.32">
      <stop offset="0" stop-color="#ffc59a" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#f76b15" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8b8d98"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="329" rx="12" fill="#f8f9fa" stroke="#dfe3e6"/>

  <!-- 1. Project: a 3D Gaussian becomes a 2D ellipse, drawn on a rectangle -->
  <g>
    <text x="133" y="46" text-anchor="middle" font-size="20" font-weight="600" fill="#1c2024">1. Project</text>
    <text x="133" y="70" text-anchor="middle" font-size="15" fill="#60646c">3D Gaussian to 2D ellipse</text>

    <g transform="rotate(-20 78 195)">
      <ellipse cx="78" cy="195" rx="50" ry="30" fill="url(#round-orange)"/>
      <line x1="38" y1="195" x2="118" y2="195" stroke="#e5484d" stroke-width="2"/>
      <line x1="78" y1="177" x2="78" y2="213" stroke="#30a46c" stroke-width="2"/>
      <line x1="68" y1="203" x2="88" y2="187" stroke="#3e63dd" stroke-width="2"/>
    </g>

    <line x1="131" y1="195" x2="149" y2="195" stroke="#8b8d98" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="rotate(-20 206 195)">
      <rect x="158" y="167" width="96" height="56" fill="none" stroke="#8b8d98" stroke-width="1.5" stroke-dasharray="5 4"/>
      <ellipse cx="206" cy="195" rx="48" ry="28" fill="url(#flat-orange)"/>
    </g>
  </g>

  <line x1="268" y1="195" x2="294" y2="195" stroke="#8b8d98" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Sort: by distance from the camera, far to near -->
  <g>
    <text x="400" y="46" text-anchor="middle" font-size="20" font-weight="600" fill="#1c2024">2. Sort</text>
    <text x="400" y="70" text-anchor="middle" font-size="15" fill="#60646c">By distance from the camera</text>

    <line x1="400" y1="280" x2="322" y2="98" stroke="#b9bbc6" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="400" y1="280" x2="478" y2="98" stroke="#b9bbc6" stroke-width="1.5" stroke-dasharray="4 4"/>

    <ellipse cx="384" cy="118" rx="26" ry="15" fill="url(#flat-blue)" transform="rotate(15 384 118)"/>
    <ellipse cx="420" cy="172" rx="33" ry="19" fill="url(#flat-green)" transform="rotate(-30 420 172)"/>
    <ellipse cx="388" cy="230" rx="38" ry="22" fill="url(#flat-orange)" transform="rotate(-20 388 230)"/>

    <circle cx="428" cy="112" r="10" fill="#1c2024"/>
    <text x="428" y="116.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <circle cx="470" cy="172" r="10" fill="#1c2024"/>
    <text x="470" y="176.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <circle cx="440" cy="236" r="10" fill="#1c2024"/>
    <text x="440" y="240.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>

    <path d="M392,282 L408,282 L413,272 L387,272 z" fill="#60646c"/>
    <rect x="386" y="282" width="28" height="18" rx="3" fill="#60646c"/>
    <circle cx="400" cy="291" r="4.5" fill="#f8f9fa"/>
  </g>

  <line x1="510" y1="195" x2="538" y2="195" stroke="#8b8d98" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Blend: draw from back to front, each partly covering what's behind -->
  <g>
    <text x="667" y="46" text-anchor="middle" font-size="20" font-weight="600" fill="#1c2024">3. Blend</text>
    <text x="667" y="70" text-anchor="middle" font-size="15" fill="#60646c">From back to front</text>

    <rect x="562" y="100" width="210" height="190" rx="6" fill="#ffffff" stroke="#dfe3e6"/>
    <ellipse cx="642" cy="168" rx="52" ry="30" fill="url(#flat-blue)" transform="rotate(15 642 168)"/>
    <ellipse cx="698" cy="190" rx="56" ry="32" fill="url(#flat-green)" transform="rotate(-30 698 190)"/>
    <ellipse cx="660" cy="226" rx="58" ry="34" fill="url(#flat-orange)" transform="rotate(-20 660 226)"/>

    <circle cx="590" cy="128" r="10" fill="#1c2024"/>
    <text x="590" y="132.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <circle cx="750" cy="146" r="10" fill="#1c2024"/>
    <text x="750" y="150.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <circle cx="590" cy="268" r="10" fill="#1c2024"/>
    <text x="590" y="272.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  </g>
</svg>
