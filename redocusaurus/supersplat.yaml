                value:
                  sourceFormat: ply
                  contentLength: 125829120
                  title: Garden scan
              minimalPlyUpload:
                summary: Minimal PLY upload
                description: >-
                  `contentLength` is optional when the file size is not
                  available at create time.
                value:
                  sourceFormat: ply
              uploadWithClient:
                summary: Upload with client metadata
                value:
                  sourceFormat: ply
                  contentLength: 125829120
                  title: Garden scan
                  uploadClient:
                    id: lcc-studio
                    version: 1.2.3
              uploadWithSoftwareTools:
                summary: Upload with software attribution
                value:
                  sourceFormat: ply
                  contentLength: 125829120
                  title: Garden scan
                  uploadClient:
                    id: lcc-studio
                    version: 1.2.3
                  softwareTools:
                    - lcc-studio
      responses:
        '200':
          description: Existing upload session for the idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
              examples:
                existingUpload:
                  summary: Existing upload session
                  value:
                    id: upl_0123456789abcdef01234567
                    status: created
                    contentLength: 125829120
                    sourceFormat: ply
                    title: Garden scan
                    description: ''
                    partSize: 67108864
                    uploadedParts: []
                    expiresAt: '2026-01-01T00:00:00.000Z'
        '201':
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
              examples:
                createdUpload:
                  summary: Created upload session
                  value:
                    id: upl_0123456789abcdef01234567
                    status: created
                    contentLength: 125829120
                    sourceFormat: ply
                    title: Garden scan
                    description: ''
                    partSize: 67108864
                    uploadedParts: []
                    expiresAt: '2026-01-01T00:00:00.000Z'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Invalid request
                  value:
                    error: Invalid request
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Authentication required
                  value:
                    error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Missing permission
                  value:
                    error: Forbidden
        '413':
          description: >-
            The file is larger than its source format allows (`code:
            file_too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTooLargeError'
              examples:
                fileTooLarge:
                  summary: File too large
                  value:
                    error: This PLY is 16.3 GB. PLY files can be up to 15 GB.
                    code: file_too_large
                    limitBytes: 16106127360
                    fileBytes: 17501991731
        '429':
          description: >-
            Rate limit exceeded, the daily publishing allowance is used up
            (`code: daily_publish_limit_reached`, with `Retry-After`), the
            account already has the maximum number of splats uploading or
            processing (`code: too_many_processing`), or another publish for the
            account is starting (`code: publish_in_progress`). Checked before
            the upload starts; completion checks again. An upload counts towards
            the processing limit until it completes, or until 20 minutes pass
            without it requesting part URLs.
          headers:
            Retry-After:
              description: >-
                Seconds until the daily allowance resets. Sent with
                `daily_publish_limit_reached` and
                `daily_download_limit_reached`.
              schema:
                type: integer
              example: 22320
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
              examples:
                dailyPublishLimitReached:
                  summary: Daily publishing allowance used up
                  value:
                    error: >-
                      You've used today's 10 GB publishing allowance. You can
                      publish again after 00:00 UTC (in 6 h 12 min).
                    code: daily_publish_limit_reached
                    limitBytes: 10737418240
                    usedBytes: 11274289152
                    resetsAt: '2026-01-02T00:00:00.000Z'
                tooManyProcessing:
                  summary: Too many splats processing
                  value:
                    error: >-
                      You have 2 scenes uploading or processing. You can upload
                      another when one finishes.
                    code: too_many_processing
                    count: 2
                    limit: 2
                    uploading: 1
                rateLimited:
                  summary: Rate limit exceeded
                  value:
                    error: Too many requests
