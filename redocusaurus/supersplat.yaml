components:
  schemas:
    CreateDownloadRequest:
      type: object
      properties:
        target:
          type: string
          enum:
            - ply
            - sog
            - ssog
          description: >-
            Download format. Every downloadable splat offers `ply`, a conversion
            to a standard PLY. A splat whose `content.format` is `sog` also
            offers `sog`, and one whose `content.format` is `ssog` also offers
            `ssog`: its published files, unchanged. A `compressed-ply` splat
            offers only `ply`. Each download is a ZIP archive; see the request
            operation for what it holds.
          examples:
            - ply
      required:
        - target
      additionalProperties: false
      description: Request body for requesting a splat download.
    CreateUploadRequest:
      type: object
      properties:
        contentLength:
          description: >-
            Total source file size in bytes. Optional but strongly recommended;
            when provided, PlayCanvas can reject over-limit uploads before S3
            multipart upload starts.
          examples:
            - 125829120
          anyOf:
            - type: integer
              minimum: 0
              maximum: 16106127360
            - type: 'null'
        sourceFormat:
          type: string
          enum:
            - ply
            - sog
            - spz
            - gsaf
            - ssog
            - lcc
          description: >-
            Format of the file being uploaded. Use `ply` for raw Gaussian splat
            PLY files, `sog` for SOG files, `spz` for SPZ files, `gsaf` for
            animated GSAF files, `ssog` for SSOG archives exported by
            SuperSplat, and `lcc` for LCC archives.
          examples:
            - ply
        title:
          description: >-
            Optional display title for the splat. If omitted, PlayCanvas assigns
            a default title.
          examples:
            - Garden scan
          type: string
          minLength: 1
          maxLength: 100
        description:
          description: Optional display description for the splat.
          examples:
            - Back garden scan captured at dusk.
          type: string
          maxLength: 5000
        uploadClient:
          description: Optional application details for the client creating the upload.
          $ref: '#/components/schemas/UploadClient'
        softwareTools:
          maxItems: 6
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[a-z0-9][a-z0-9-]{0,63}$
            description: Software catalogue ID.
            examples:
              - lcc-studio
          description: >-
            Optional software catalogue IDs to attribute to the created splat.
            Use the software catalogue endpoint to discover currently supported
            IDs; this field is not an OpenAPI enum because the catalogue may
            grow over time.
          examples:
            - - lcc-studio
          uniqueItems: true
      required:
        - sourceFormat
      additionalProperties: false
      description: Request body for creating a resumable splat upload session.
    UploadClient:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9-]{0,63}$
          description: >-
            Stable lowercase identifier for the application or integration
            creating the upload, such as `lcc-studio`.
          examples:
            - lcc-studio
        version:
          description: Optional version of the upload client application.
          examples:
            - 1.2.3
          type: string
          minLength: 1
          maxLength: 64
      required:
        - id
      additionalProperties: false
      description: Client application details captured with the upload.
    CreateUploadPartUrlsRequest:
      type: object
      properties:
        parts:
          minItems: 1
          maxItems: 100
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 10000
            description: One-based part number in the multipart upload.
            examples:
              - 1
          description: >-
            One-based part numbers to create signed upload URLs for. Calculate
            these by splitting the source file using the upload session
            `partSize`, and request only the parts you are ready to upload.
      required:
        - parts
      additionalProperties: false
      description: Request body for creating signed URLs for explicit upload parts.
    CompleteUploadRequest:
      type: object
      properties:
        parts:
          minItems: 1
          maxItems: 10000
          type: array
          items:
            type: object
            properties:
              partNumber:
                type: integer
                minimum: 1
                maximum: 10000
                description: One-based part number in the multipart upload.
                examples:
                  - 1
              etag:
                type: string
                minLength: 1
                description: ETag returned by S3 after uploading this part.
                examples:
                  - '"abc123"'
            required:
              - partNumber
              - etag
            additionalProperties: false
          description: >-
            Uploaded parts to commit. Include each uploaded part number and its
            S3 ETag.
      required:
        - parts
      additionalProperties: false
      description: >-
        Request body for completing a resumable upload and queuing splat
        processing.
    Me:
      type: object
      properties:
        id:
          type: string
          description: Authenticated user id.
          examples:
            - '123'
        username:
          description: Username, when available.
          examples:
            - artist
          anyOf:
            - type: string
            - type: 'null'
      required:
        - id
      additionalProperties: {}
      description: Authenticated caller identity.
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
      required:
        - error
      additionalProperties: {}
      description: Error response.
    SplatList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Splat'
          description: Splats owned by the authenticated user.
        pagination:
          type: object
          properties:
            skip:
              type: integer
              minimum: 0
              maximum: 100000
              description: Number of splats skipped.
            limit:
              type: integer
              minimum: 1
              maximum: 128
              description: Maximum number of splats requested.
            total:
              type: integer
              minimum: 0
              maximum: 100000000
              description: Total matching splats owned by the caller.
          required:
            - skip
            - limit
            - total
          additionalProperties: {}
      required:
        - data
        - pagination
      additionalProperties: {}
      description: Paginated splat list.
    Splat:
      type: object
      properties:
        id:
          type: string
          description: Public 8-character splat id.
          examples:
            - a1b2c3d4
        title:
          type: string
          description: Display title.
          examples:
            - garden-scan
        description:
          type: string
          description: Display description.
          examples:
            - ''
        status:
          type: string
          enum:
            - processing
            - completed
            - failed
          description: Publish lifecycle state of the splat.
          examples:
            - processing
        visibility:
          type: string
          enum:
            - listed
            - unlisted
          description: >-
            Whether the splat is listed publicly or only reachable by direct
            link.
          examples:
            - unlisted
        format:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            Published output format once processing completes. `null` while
            processing.
          examples:
            - null
        size:
          type: integer
          minimum: 0
          maximum: 16106127360
          description: >-
            Published splat size in bytes. Processing splats may report `0`
            until output is available.
          examples:
            - 0
        viewerUrl:
          type: string
          description: URL where the splat can be viewed.
          examples:
            - https://superspl.at/scene/a1b2c3d4
        createdAt:
          anyOf:
            - type: string
              format: date-time
              pattern: >-
                ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: 'null'
          description: Creation timestamp.
          examples:
            - '2026-01-01T00:00:00.000Z'
        updatedAt:
          anyOf:
            - type: string
              format: date-time
              pattern: >-
                ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: 'null'
          description: Last update timestamp.
          examples:
            - '2026-01-01T00:00:00.000Z'
        completedAt:
          anyOf:
            - type: string
              format: date-time
              pattern: >-
                ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: 'null'
          description: Processing completion timestamp, or `null` while processing.
          examples:
            - null
        author:
          $ref: '#/components/schemas/SplatAuthor'
        thumbnails:
          anyOf:
            - $ref: '#/components/schemas/SplatThumbnails'
            - type: 'null'
          description: >-
            Thumbnail image URLs, or `null` when the splat has no thumbnails
            yet.
        downloadable:
          type: boolean
          description: >-
            Whether anyone, the owner included, may download the published
            files: the owner allows downloads with a license, the splat is
            published, and it is not GSAF. `license` and `content` are set only
            when `true`.
          examples:
            - true
        license:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            Creative Commons license the files are offered under, when
            `downloadable`: currently one of `by`, `by-sa`, `by-nd`, `by-nc`,
            `by-nc-sa` and `by-nc-nd` (CC BY 4.0 and its variants). Not an enum,
            as more may be added. `null` when not downloadable.
          examples:
            - by
        content:
          anyOf:
            - $ref: '#/components/schemas/SplatContent'
            - type: 'null'
          description: >-
            Describes the published files, when `downloadable`; download them
            with `POST /v1/splats/{splatId}/downloads`. `null` when not
            downloadable.
      required:
        - id
        - title
        - description
        - status
        - visibility
        - format
        - size
        - viewerUrl
        - createdAt
        - updatedAt
        - completedAt
        - author
        - thumbnails
        - downloadable
        - license
        - content
      additionalProperties: {}
      description: >-
        Splat scene. Any authenticated caller can get any splat by id, listed or
        unlisted, as anyone with its link can open it on the web.
    SplatAuthor:
      type: object
      properties:
        username:
          type: string
          description: Username of the account that published the splat.
          examples:
            - artist
        displayName:
          type: string
          description: >-
            Name to credit the author by: their full name, or their username
            when they have none.
          examples:
            - Ada Artist
      required:
        - username
        - displayName
      additionalProperties: {}
      description: Account that published the splat.
    SplatThumbnails:
      type: object
      properties:
        s:
          type: string
          description: Small WebP thumbnail URL.
        m:
          type: string
          description: Medium WebP thumbnail URL.
        l:
          type: string
          description: Large WebP thumbnail URL.
        xl:
          type: string
          description: Extra large WebP thumbnail URL.
      required:
        - s
        - m
        - l
        - xl
      additionalProperties: {}
      description: Thumbnail image URLs.
    SplatContent:
      type: object
      properties:
        format:
          type: string
          enum:
            - sog
            - ssog
            - compressed-ply
          description: >-
            Format of the published files: `sog`, `ssog` (streamed SOG with
            levels of detail) or `compressed-ply`. Download them in the target
            of the same name (`sog` or `ssog`), or as `ply` for any format.
            Treat values you do not recognize as unsupported, and request a
            `ply` download instead.
          examples:
            - sog
        version:
          type: integer
          minimum: 1
          maximum: 1000000
          description: >-
            Published version of the files. It changes when the owner
            republishes the splat.
          examples:
            - 1
        splatCount:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 4294967296
            - type: 'null'
          description: >-
            Number of Gaussians, at the finest level of detail for `ssog`.
            `null` when not known, as for some older scenes or while the owner
            republishes the splat.
          examples:
            - 7500000
        lodCounts:
          description: >-
            Number of Gaussians at each level of detail, finest first, for
            `ssog` when known (see `splatCount`). Levels are alternatives, not
            parts of a total.
          examples:
            - - 7500000
              - 3750000
              - 1875000
              - 937500
              - 466000
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 4294967296
      required:
        - format
        - version
        - splatCount
      additionalProperties: {}
      description: >-
        What a downloadable splat's published files are. Get the files with
        `POST /v1/splats/{splatId}/downloads`.
    Download:
      type: object
      properties:
        splatId:
          type: string
          description: Public id of the splat being downloaded.
          examples:
            - a1b2c3d4
        target:
          type: string
          enum:
            - ply
            - sog
            - ssog
          description: >-
            Download format. Every downloadable splat offers `ply`, a conversion
            to a standard PLY. A splat whose `content.format` is `sog` also
            offers `sog`, and one whose `content.format` is `ssog` also offers
            `ssog`: its published files, unchanged. A `compressed-ply` splat
            offers only `ply`. Each download is a ZIP archive; see the request
            operation for what it holds.
          examples:
            - ply
        version:
          type: integer
          minimum: 1
          maximum: 1000000
          description: >-
            Published version the download is for. If it differs from the
            splat's `content.version`, the splat was republished: request the
            download again.
          examples:
            - 1
        status:
          type: string
          enum:
            - queued
            - processing
            - ready
            - failed
          description: >-
            Preparation state. When `ready`, get the file with `POST
            /v1/splats/{splatId}/downloads/{target}/file`. When `failed`,
            request the download again to retry.
          examples:
            - queued
        bytes:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 1099511627776
            - type: 'null'
          description: Size of the file, in bytes, when `ready`; `null` otherwise.
          examples:
            - null
      required:
        - splatId
        - target
        - version
        - status
        - bytes
      additionalProperties: {}
      description: >-
        A splat download in one target, being prepared or ready. A splat has at
        most one current download per target, found by the splat id and target.
    DownloadFile:
      type: object
      properties:
        url:
          type: string
          description: >-
            Short-lived signed URL of the ZIP archive. Start fetching it before
            `urlExpiresAt`; a fetch that has started runs to the end. For a new
            URL, request the file again.
          examples:
            - >-
              https://example-bucket.s3.amazonaws.com/download-artifacts/a1b2c3d4/v1/ssog/0123456789abcdef0123456789abcdef/archive.zip?X-Amz-Signature=...
        urlExpiresAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: When `url` stops working for new requests.
          examples:
            - '2026-01-01T00:05:00.000Z'
        bytes:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 1099511627776
            - type: 'null'
          description: Size of the file at `url`, in bytes, when known.
          examples:
            - 92536832
        version:
          type: integer
          minimum: 1
          maximum: 1000000
          description: >-
            Published version the download is for. If it differs from the
            splat's `content.version`, the splat was republished: request the
            download again.
          examples:
            - 1
      required:
        - url
        - urlExpiresAt
        - bytes
        - version
      additionalProperties: {}
      description: A short-lived URL of a ready download.
    DownloadNotReadyError:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          const: not_ready
          description: >-
            The download is still `queued` or `processing`, or it `failed`. Poll
            it, or request it again.
      required:
        - error
        - code
      additionalProperties: {}
      description: The download has no file yet.
    TooManyRequestsError:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          description: >-
            `daily_publish_limit_reached` when the daily publishing allowance is
            used up; `too_many_processing` when the account already has the
            maximum number of splats uploading or processing;
            `publish_in_progress` when another publish for the account is
            starting; `daily_download_limit_reached` when the account has
            downloaded its daily number of splats. Absent when rate limited.
          type: string
          enum:
            - daily_publish_limit_reached
            - too_many_processing
            - publish_in_progress
            - daily_download_limit_reached
        limitBytes:
          description: Today's publishing allowance, in bytes of compressed output.
          type: integer
          minimum: 0
          maximum: 1099511627776
        usedBytes:
          description: Compressed output published today (UTC), in bytes.
          type: integer
          minimum: 0
          maximum: 1099511627776
        resetsAt:
          description: >-
            When the allowance resets (the next 00:00 UTC), as an ISO 8601
            timestamp, with `daily_publish_limit_reached` and
            `daily_download_limit_reached`.
          examples:
            - '2026-01-02T00:00:00.000Z'
          type: string
        count:
          description: >-
            Splats currently uploading or processing, with
            `too_many_processing`; splats downloaded today (UTC), whatever the
            target, with `daily_download_limit_reached`.
          type: integer
          minimum: 0
          maximum: 10000
        limit:
          description: >-
            Splats that may upload or process at once, with
            `too_many_processing`; splats that may be downloaded per UTC day,
            with `daily_download_limit_reached`.
          type: integer
          minimum: 0
          maximum: 10000
        uploading:
          description: >-
            Of `count`, the uploads not yet completed, with
            `too_many_processing`.
          type: integer
          minimum: 0
          maximum: 10000
      required:
        - error
      additionalProperties: {}
      description: >-
        Rate limit, daily publishing or download allowance, or processing limit
        error.
    UploadSession:
      type: object
      properties:
        id:
          type: string
          description: Resumable upload session id.
          examples:
            - upl_0123456789abcdef01234567
        status:
          type: string
          enum:
            - created
            - uploading
            - processing
            - completed
            - canceled
          description: >-
            Lifecycle state of the resumable upload session. `processing` means
            the bytes have been committed and the splat is being finalized.
          examples:
            - created
        contentLength:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 16106127360
            - type: 'null'
          description: >-
            Total source file size declared when creating the upload, or `null`
            when the client did not provide one.
          examples:
            - null
        sourceFormat:
          type: string
          enum:
            - ply
            - sog
            - spz
            - gsaf
            - ssog
            - lcc
          description: >-
            Format of the file being uploaded. Use `ply` for raw Gaussian splat
            PLY files, `sog` for SOG files, `spz` for SPZ files, `gsaf` for
            animated GSAF files, `ssog` for SSOG archives exported by
            SuperSplat, and `lcc` for LCC archives.
          examples:
            - ply
        title:
          type: string
          description: Display title that will be used for the created splat.
          examples:
            - garden-scan
        description:
          type: string
          description: Display description that will be used for the created splat.
          examples:
            - ''
        softwareTools:
          maxItems: 6
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[a-z0-9][a-z0-9-]{0,63}$
            description: Software catalogue ID.
            examples:
              - lcc-studio
          description: >-
            Optional software catalogue IDs to attribute to the created splat.
            Use the software catalogue endpoint to discover currently supported
            IDs; this field is not an OpenAPI enum because the catalogue may
            grow over time.
          examples:
            - - lcc-studio
          uniqueItems: true
        partSize:
          type: integer
          minimum: 1
          maximum: 16106127360
          description: >-
            Server-chosen target size in bytes for each uploaded part. Use this
            to split the file into multipart upload ranges; the final part may
            be smaller.
          examples:
            - 67108864
        uploadedParts:
          type: array
          items:
            type: object
            properties:
              partNumber:
                type: integer
                minimum: 1
                maximum: 10000
                description: One-based part number in the multipart upload.
                examples:
                  - 1
              etag:
                type: string
                description: ETag for the uploaded part.
                examples:
                  - '"abc123"'
              size:
                description: >-
                  Actual observed size of this uploaded part in bytes, when
                  known. This is resume metadata, not the target chunk size.
                examples:
                  - 67108864
                type: integer
                minimum: 0
                maximum: 16106127360
            required:
              - partNumber
              - etag
            additionalProperties: {}
          description: >-
            Parts already observed by the server. Useful when resuming an
            interrupted upload.
        expiresAt:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: When this upload session expires.
          examples:
            - '2026-01-01T00:00:00.000Z'
      required:
        - id
        - status
        - contentLength
        - sourceFormat
        - title
        - description
        - partSize
        - uploadedParts
        - expiresAt
      additionalProperties: {}
      description: Resumable upload session state.
    FileTooLargeError:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          const: file_too_large
          description: The file is larger than its source format allows.
        limitBytes:
          type: integer
          minimum: 0
          maximum: 16106127360
          description: Largest file allowed for this source format, in bytes.
        fileBytes:
          type: integer
          minimum: 0
          maximum: 1099511627776
          description: Size of the file, in bytes.
      required:
        - error
        - code
        - limitBytes
        - fileBytes
      additionalProperties: {}
      description: Upload size limit error.
    UploadPartUrls:
      type: object
      properties:
        uploadId:
          type: string
          description: Resumable upload session id.
          examples:
            - upl_0123456789abcdef01234567
        partSize:
          type: integer
          minimum: 1
          maximum: 16106127360
          description: >-
            Server-chosen target size in bytes for each uploaded part. Matches
            the upload session `partSize`.
          examples:
            - 67108864
        urls:
          type: array
          items:
            type: object
            properties:
              partNumber:
                type: integer
                minimum: 1
                maximum: 10000
                description: One-based part number in the multipart upload.
                examples:
                  - 1
              url:
                type: string
                description: Signed URL. Upload the bytes for this part with an HTTP PUT.
                examples:
                  - https://example-bucket.s3.amazonaws.com/uploads/part-1
              expiresAt:
                type: string
                format: date-time
                pattern: >-
                  ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                description: When this signed URL expires.
                examples:
                  - '2026-01-01T00:20:00.000Z'
            required:
              - partNumber
              - url
              - expiresAt
            additionalProperties: {}
          description: Signed URLs for the requested part numbers.
      required:
        - uploadId
        - partSize
        - urls
      additionalProperties: {}
      description: Signed URLs for uploading multipart data.
    CompleteUploadResponse:
      type: object
      properties:
        uploadId:
          type: string
          description: Resumable upload session id.
          examples:
            - upl_0123456789abcdef01234567
        status:
          type: string
          const: completed
          description: Upload session status after completion.
        splatId:
          type: string
          description: >-
            Opaque public splat id. Use `GET /v1/splats/{splatId}` to retrieve
            the splat representation.
          examples:
            - a1b2c3d4
        editUrl:
          type: string
          description: >-
            URL where the creator can continue editing the splat after upload
            completion.
          examples:
            - https://superspl.at/scene/a1b2c3d4/edit
      required:
        - uploadId
        - status
        - splatId
        - editUrl
      additionalProperties: {}
      description: >-
        Upload completion result. Use the returned `splatId` to fetch the splat
        representation.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
