openapi: 3.1.0
info:
  title: SuperSplat API
  version: 1.0.0
  description: >-
    Use this API to upload Gaussian splat scenes, list the scenes owned by the
    authenticated user, and look up and download any scene whose owner allows
    downloads.


    Typical upload flow:


    1. Create a resumable upload session with a source format and optional
    display metadata.

    2. Request signed URLs for the part numbers you want to upload, then PUT the
    bytes to those URLs.

    3. Complete the upload with the uploaded part ETags. The splat is created
    immediately and may remain in `processing` while processing finishes.


    Typical import flow:


    1. Get the splat by id. When `downloadable` is `true`, `content` describes
    its published files.

    2. Request a download with `POST /v1/splats/{splatId}/downloads` in a target
    the splat offers: `sog` for a `sog` splat, `ssog` for an `ssog` splat, or
    `ply` for any.

    3. Poll `GET /v1/splats/{splatId}/downloads/{target}` until its `status` is
    `ready`. If it is `failed`, request the download again.

    4. Get a short-lived URL with `POST
    /v1/splats/{splatId}/downloads/{target}/file`, then fetch it: a ZIP archive
    of the files and their license.


    A download is the only way the API gives you a splat's files.
tags:
  - name: Account
    description: Caller identity.
  - name: Splats
    description: List splats owned by the authenticated user, and get any splat by id.
  - name: Uploads
    description: Create and complete resumable splat uploads.
  - name: Downloads
    description: Download the published files of splats whose owners allow downloads.
servers:
  - url: https://playcanvas.com/api/supersplat
security:
  - bearerAuth: []
paths:
  /v1/me:
    get:
      tags:
        - Account
      summary: Get the authenticated caller
      description: Returns the authenticated caller identity.
      operationId: getMe
      responses:
        '200':
          description: Authenticated caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                currentUser:
                  summary: Authenticated caller
                  value:
                    id: '123'
                    username: artist
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Authentication required
                  value:
                    error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Missing permission
                  value:
                    error: Forbidden
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Rate limit exceeded
                  value:
                    error: Too many requests
  /v1/splats:
    get:
      tags:
        - Splats
      summary: List splats owned by the authenticated caller
      description: >-
        Returns a paginated list of splats owned by the authenticated user. The
        response uses `visibility`; there is no separate `listed` boolean in
        this API.
      operationId: listSplats
      parameters:
        - in: query
          name: limit
          schema:
            description: Maximum number of splats to return.
            examples:
              - 50
            default: 50
            type: integer
            minimum: 1
            maximum: 128
          description: Maximum number of splats to return.
        - in: query
          name: skip
          schema:
            description: Number of splats to skip.
            examples:
              - 0
            default: 0
            type: integer
            minimum: 0
            maximum: 100000
          description: Number of splats to skip.
      responses:
        '200':
          description: Caller splats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplatList'
              examples:
                ownedSplats:
                  summary: Owned splats
                  value:
                    data:
                      - id: a1b2c3d4
                        title: garden-scan
                        description: ''
                        status: processing
                        visibility: unlisted
                        format: null
                        size: 0
                        viewerUrl: https://superspl.at/scene/a1b2c3d4
                        createdAt: '2026-01-01T00:00:00.000Z'
                        updatedAt: '2026-01-01T00:00:00.000Z'
                        completedAt: null
                        author:
                          username: artist
                          displayName: Ada Artist
                        thumbnails: null
                        downloadable: false
                        license: null
                        content: null
                    pagination:
                      skip: 0
                      limit: 50
                      total: 1
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Authentication required
                  value:
                    error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Missing permission
                  value:
                    error: Forbidden
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Rate limit exceeded
                  value:
                    error: Too many requests
  /v1/splats/{splatId}:
    get:
      tags:
        - Splats
      summary: Get a splat by id
      description: >-
        Returns any splat by id, whoever owns it, listed or unlisted. Newly
        completed uploads may return `status: "processing"` until processing
        finishes. `content` describes the published files only when
        `downloadable` is `true`; the owner gets no exception.
      operationId: getSplat
      parameters:
        - in: path
          name: splatId
          schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Opaque public splat id.
            examples:
              - a1b2c3d4
          required: true
          description: Opaque public splat id.
      responses:
        '200':
          description: Splat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Splat'
              examples:
                downloadableSplat:
                  summary: Downloadable splat
                  value:
                    id: a1b2c3d4
                    title: Garden scan
                    description: ''
                    status: completed
                    visibility: listed
                    format: ssog
                    size: 92274688
                    viewerUrl: https://superspl.at/scene/a1b2c3d4
                    createdAt: '2026-01-01T00:00:00.000Z'
                    updatedAt: '2026-01-01T00:00:00.000Z'
                    completedAt: '2026-01-01T00:20:00.000Z'
                    author:
                      username: artist
                      displayName: Ada Artist
                    thumbnails:
                      s: >-
                        https://s3-eu-west-1.amazonaws.com/images.playcanvas.com/splat/a1b2c3d4/v1/s.webp
                      m: >-
                        https://s3-eu-west-1.amazonaws.com/images.playcanvas.com/splat/a1b2c3d4/v1/m.webp
                      l: >-
                        https://s3-eu-west-1.amazonaws.com/images.playcanvas.com/splat/a1b2c3d4/v1/l.webp
                      xl: >-
                        https://s3-eu-west-1.amazonaws.com/images.playcanvas.com/splat/a1b2c3d4/v1/xl.webp
                    downloadable: true
                    license: by
                    content:
                      format: ssog
                      version: 1
                      splatCount: 7500000
                      lodCounts:
                        - 7500000
                        - 3750000
                        - 1875000
                        - 937500
                        - 466000
                notDownloadableSplat:
                  summary: Splat that is not downloadable
                  value:
                    id: a1b2c3d4
                    title: Garden scan
                    description: ''
                    status: completed
                    visibility: listed
                    format: ssog
                    size: 92274688
                    viewerUrl: https://superspl.at/scene/a1b2c3d4
                    createdAt: '2026-01-01T00:00:00.000Z'
                    updatedAt: '2026-01-01T00:00:00.000Z'
                    completedAt: '2026-01-01T00:20:00.000Z'
                    author:
                      username: artist
                      displayName: Ada Artist
                    thumbnails:
                      s: >-
                        https://s3-eu-west-1.amazonaws.com/images.playcanvas.com/splat/a1b2c3d4/v1/s.webp
                      m: >-
                        https://s3-eu-west-1.amazonaws.com/images.playcanvas.com/splat/a1b2c3d4/v1/m.webp
                      l: >-
                        https://s3-eu-west-1.amazonaws.com/images.playcanvas.com/splat/a1b2c3d4/v1/l.webp
                      xl: >-
                        https://s3-eu-west-1.amazonaws.com/images.playcanvas.com/splat/a1b2c3d4/v1/xl.webp
                    downloadable: false
                    license: null
                    content: null
                processingSplat:
                  summary: Processing splat
                  value:
                    id: a1b2c3d4
                    title: garden-scan
                    description: ''
                    status: processing
                    visibility: unlisted
                    format: null
                    size: 0
                    viewerUrl: https://superspl.at/scene/a1b2c3d4
                    createdAt: '2026-01-01T00:00:00.000Z'
                    updatedAt: '2026-01-01T00:00:00.000Z'
                    completedAt: null
                    author:
                      username: artist
                      displayName: Ada Artist
                    thumbnails: null
                    downloadable: false
                    license: null
                    content: null
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Authentication required
                  value:
                    error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Missing permission
                  value:
                    error: Forbidden
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Resource not found
                  value:
                    error: Resource not found
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Rate limit exceeded
                  value:
                    error: Too many requests
  /v1/splats/{splatId}/downloads:
    post:
      tags:
        - Downloads
      summary: Request a splat download
      description: >-
        Prepares a download of a `downloadable` splat in `target`, whoever owns
        the splat, and returns its state. Downloads are shared and cached, so a
        splat someone downloaded recently is often `ready` at once. Otherwise
        poll `GET /v1/splats/{splatId}/downloads/{target}` until it is. Then get
        its file with `POST /v1/splats/{splatId}/downloads/{target}/file`.
        Requesting a download hands out no URL and uses none of the daily
        download allowance.


        The download is a ZIP archive with its files at the root and the license
        (title, author, source, license and its requirements) in `license.txt`:


        - `sog`: the published SOG, its `meta.json` and the WebP textures it
        names. The archive is itself a bundled SOG, which SOG readers open
        despite `license.txt`, so its file is named `<title>.sog`.

        - `ssog`: `lod-meta.json` (plain JSON) and every folder it names, each a
        `meta.json` with its WebP textures: one per level-of-detail chunk
        (`<level>_<chunk>/`), and the environment SOG (usually `env/`) when it
        has one.

        - `ply`: `scene.ply`, converted from the published files. For `ssog` it
        holds the finest level of detail merged with the environment.
      operationId: createSplatDownload
      parameters:
        - in: path
          name: splatId
          schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Opaque public splat id.
            examples:
              - a1b2c3d4
          required: true
          description: Opaque public splat id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDownloadRequest'
            examples:
              ssogDownload:
                summary: Download of an ssog splat's own files
                value:
                  target: ssog
              plyDownload:
                summary: PLY download
                value:
                  target: ply
      responses:
        '200':
          description: 'The download already exists: queued, processing or ready'
          headers:
            Location:
              description: API URL to poll the download at.
              schema:
                type: string
              example: /api/supersplat/v1/splats/a1b2c3d4/downloads/ssog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
              examples:
                readyDownload:
                  summary: Ready download
                  value:
                    splatId: a1b2c3d4
                    target: ssog
                    version: 1
                    status: ready
                    bytes: 92536832
        '202':
          description: Download queued for preparation
          headers:
            Location:
              description: API URL to poll the download at.
              schema:
                type: string
              example: /api/supersplat/v1/splats/a1b2c3d4/downloads/ssog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
              examples:
                queuedDownload:
                  summary: Queued download
                  value:
                    splatId: a1b2c3d4
                    target: ssog
                    version: 1
                    status: queued
                    bytes: null
        '400':
          description: Invalid request, or a `target` the splat does not offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                targetNotOffered:
                  summary: Target the splat does not offer
                  value:
                    error: >-
                      target: "sog" is not available for this splat, whose
                      content.format is "ssog". Use "ssog" or "ply".
                invalidRequest:
                  summary: Invalid request
                  value:
                    error: Invalid request
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Authentication required
                  value:
                    error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Missing permission
                  value:
                    error: Forbidden
        '404':
          description: The splat does not exist, or is not downloadable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notDownloadable:
                  summary: Not downloadable
                  value:
                    error: downloadable splat not found
                splatNotFound:
                  summary: Splat not found
                  value:
                    error: splat not found
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Rate limit exceeded
                  value:
                    error: Too many requests
  /v1/splats/{splatId}/downloads/{target}:
    get:
      tags:
        - Downloads
      summary: Get a splat download
      description: >-
        Returns the state of the splat's current download in `target`. Polling
        changes nothing: it hands out no URL and uses no allowance. A
        preparation that stalls reads as `failed`. A download lasts while the
        splat stays the same. Once the splat is republished, renamed or
        relicensed, its author is renamed, or its downloads are switched off,
        this returns `404`: request the download again.
      operationId: getSplatDownload
      parameters:
        - in: path
          name: splatId
          schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Opaque public splat id.
            examples:
              - a1b2c3d4
          required: true
          description: Opaque public splat id.
        - in: path
          name: target
          schema:
            type: string
            enum:
              - ply
              - sog
              - ssog
            description: >-
              Download format. Every downloadable splat offers `ply`, a
              conversion to a standard PLY. A splat whose `content.format` is
              `sog` also offers `sog`, and one whose `content.format` is `ssog`
              also offers `ssog`: its published files, unchanged. A
              `compressed-ply` splat offers only `ply`. Each download is a ZIP
              archive; see the request operation for what it holds.
            examples:
              - ply
          required: true
          description: >-
            Download format. Every downloadable splat offers `ply`, a conversion
            to a standard PLY. A splat whose `content.format` is `sog` also
            offers `sog`, and one whose `content.format` is `ssog` also offers
            `ssog`: its published files, unchanged. A `compressed-ply` splat
            offers only `ply`. Each download is a ZIP archive; see the request
            operation for what it holds.
      responses:
        '200':
          description: Download
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
              examples:
                processingDownload:
                  summary: Processing download
                  value:
                    splatId: a1b2c3d4
                    target: ssog
                    version: 1
                    status: processing
                    bytes: null
                readyDownload:
                  summary: Ready download
                  value:
                    splatId: a1b2c3d4
                    target: ssog
                    version: 1
                    status: ready
                    bytes: 92536832
        '400':
          description: Invalid request, or a `target` the splat does not offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                targetNotOffered:
                  summary: Target the splat does not offer
                  value:
                    error: >-
                      target: "sog" is not available for this splat, whose
                      content.format is "ssog". Use "ssog" or "ply".
                invalidRequest:
                  summary: Invalid request
                  value:
                    error: Invalid request
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Authentication required
                  value:
                    error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Missing permission
                  value:
                    error: Forbidden
        '404':
          description: >-
            The splat does not exist or is not downloadable, or no download in
            `target` was requested for its current version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notDownloadable:
                  summary: Not downloadable
                  value:
                    error: downloadable splat not found
                splatNotFound:
                  summary: Splat not found
                  value:
                    error: splat not found
                downloadNotFound:
                  summary: Download not requested
                  value:
                    error: download not found
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Rate limit exceeded
                  value:
                    error: Too many requests
  /v1/splats/{splatId}/downloads/{target}/file:
    post:
      tags:
        - Downloads
      summary: Get the file of a splat download
      description: >-
        Returns a short-lived signed URL of a `ready` download's ZIP archive.
        This is the download: it counts towards the account's daily download
        allowance and the splat's download count. Each splat counts once per UTC
        day towards the allowance, whatever its target and however often its
        file is requested.
      operationId: createSplatDownloadFile
      parameters:
        - in: path
          name: splatId
          schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Opaque public splat id.
            examples:
              - a1b2c3d4
          required: true
          description: Opaque public splat id.
        - in: path
          name: target
          schema:
            type: string
            enum:
              - ply
              - sog
              - ssog
            description: >-
              Download format. Every downloadable splat offers `ply`, a
              conversion to a standard PLY. A splat whose `content.format` is
              `sog` also offers `sog`, and one whose `content.format` is `ssog`
              also offers `ssog`: its published files, unchanged. A
              `compressed-ply` splat offers only `ply`. Each download is a ZIP
              archive; see the request operation for what it holds.
            examples:
              - ply
          required: true
          description: >-
            Download format. Every downloadable splat offers `ply`, a conversion
            to a standard PLY. A splat whose `content.format` is `sog` also
            offers `sog`, and one whose `content.format` is `ssog` also offers
            `ssog`: its published files, unchanged. A `compressed-ply` splat
            offers only `ply`. Each download is a ZIP archive; see the request
            operation for what it holds.
      responses:
        '200':
          description: Download file URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadFile'
              examples:
                downloadFile:
                  summary: Download file URL
                  value:
                    url: >-
                      https://example-bucket.s3.amazonaws.com/download-artifacts/a1b2c3d4/v1/ssog/0123456789abcdef0123456789abcdef/archive.zip?X-Amz-Signature=...
                    urlExpiresAt: '2026-01-01T00:05:00.000Z'
                    bytes: 92536832
                    version: 1
        '400':
          description: Invalid request, or a `target` the splat does not offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                targetNotOffered:
                  summary: Target the splat does not offer
                  value:
                    error: >-
                      target: "sog" is not available for this splat, whose
                      content.format is "ssog". Use "ssog" or "ply".
                invalidRequest:
                  summary: Invalid request
                  value:
                    error: Invalid request
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Authentication required
                  value:
                    error: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error:
                  summary: Missing permission
                  value:
                    error: Forbidden
        '404':
          description: >-
            The splat does not exist or is not downloadable, no download in
            `target` was requested for its current version, or its file is gone:
            request the download again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notDownloadable:
                  summary: Not downloadable
                  value:
                    error: downloadable splat not found
                splatNotFound:
                  summary: Splat not found
                  value:
                    error: splat not found
                downloadNotFound:
                  summary: Download not requested
                  value:
                    error: download not found
                fileGone:
                  summary: Download file gone
                  value:
                    error: download file not found
        '409':
          description: >-
            The download is not ready yet (`code: not_ready`). Poll it until it
            is `ready`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadNotReadyError'
              examples:
                notReady:
                  summary: Download not ready yet
                  value:
                    error: download is not ready yet
                    code: not_ready
        '429':
          description: >-
            Rate limit exceeded, or the account has downloaded its daily number
            of splats (`code: daily_download_limit_reached`, with
            `Retry-After`).
          headers:
            Retry-After:
              description: >-
                Seconds until the daily allowance resets. Sent with
                `daily_publish_limit_reached` and
                `daily_download_limit_reached`.
              schema:
                type: integer
              example: 22320
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
              examples:
                dailyDownloadLimitReached:
                  summary: Daily download allowance used up
                  value:
                    error: >-
                      You've downloaded today's limit of 100 scenes. You can
                      download more after 00:00 UTC (in 6 h 12 min).
                    code: daily_download_limit_reached
                    limit: 100
                    count: 100
                    resetsAt: '2026-01-02T00:00:00.000Z'
                rateLimited:
                  summary: Rate limit exceeded
                  value:
                    error: Too many requests
  /v1/splats/uploads:
    post:
      tags:
        - Uploads
      summary: Create a resumable splat upload
      description: >-
        Starts a multipart upload and returns a resumable upload session.
        `title` is optional; when omitted, PlayCanvas assigns a default title.
        New splats are unlisted by default. Use `softwareTools` to explicitly
        attribute catalogue software IDs to the created splat.
      operationId: createSplatUpload
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            description: >-
              Optional key for retrying create-upload requests safely. Reusing
              the same key returns the existing upload session.
            examples:
              - upload-garden-scan-2026-01-01
            type: string
            minLength: 1
            maxLength: 200
          description: >-
            Optional key for retrying create-upload requests safely. Reusing the
            same key returns the existing upload session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
            examples:
              recommendedPlyUpload:
                summary: Recommended PLY upload
